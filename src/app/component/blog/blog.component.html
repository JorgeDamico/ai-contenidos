<div class="container-fluid">
  <div class="row">
    <div class="col-12 col-md-2 bg-light pt-4">
      <p class="text-center fs-4 mb-4 pt-3">Contenidos</p>
      @for (post of postHead; track post.slug) {
        <a [routerLink]="['/blog/', post.slug]" 
          class="d-flex align-items-center justify-content-between p-3 bg-white border rounded-3 text-decoration-none shadow-sm p-2 mb-3 post-link">
          <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-2" style="width: 42px; height: 42px;">
              <i class="bi bi-journal-text fs-5"></i>
            </div>
            <div>
              <span class="d-block fw-semibold text-dark">{{ post.title }}</span>
              <span class="d-block small text-muted">{{ post.description }}</span>
            </div>
          </div>
          <i class="bi bi-chevron-right text-secondary"></i>
        </a>
      }
    </div>

    <div class="col-12 col-md-10 d-flex justify-content-center align-items-start pt-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
